[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iristool"
version = "0.5.1"
description = "Simple pandas and SQL helpers for InterSystems IRIS"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Pietro Di Leo"}]
dependencies = ["pandas>=2.2,<4", "intersystems-irispython>=5.2.1,<6"]

[project.optional-dependencies]
all = ["iristool[mcp,excel,integrations]"]
excel = ["openpyxl>=3.1.5,<4"]
kaggle = [
    "kagglehub>=1.0.2,<1.0.3; python_version < '3.11'",
    "kagglehub>=1.0.3,<2; python_version >= '3.11'",
]
huggingface = ["datasets>=4,<5"]
integrations = [
    "kagglehub>=1.0.2,<1.0.3; python_version < '3.11'",
    "kagglehub>=1.0.3,<2; python_version >= '3.11'",
    "datasets>=4,<5",
]
mcp = [
    "fastmcp>=2.14,<3",
    "tomli>=2,<3 ; python_full_version < '3.11'",
]

[project.scripts]
iristool-export = "iristool.cli:main_export"
iristool-mcp = "iristool.mcp_server:main"
iristool-kaggle = "iristool.integrations.cli:main_kaggle"
iristool-hf = "iristool.integrations.cli:main_huggingface"

[project.urls]
Homepage = "https://github.com/pietrodileo/iristool"
Issues = "https://github.com/pietrodileo/iristool/issues"

[tool.setuptools.packages.find]
where = ["src"]
