name: Build and publish to PyPI

on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          tag = os.environ['RELEASE_TAG']
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag} must match package version v{version}')
          PY
      - name: Install all optional dependencies
        run: uv sync --locked --all-extras
      - name: Run unit tests (no server or source credentials needed)
        run: uv run --locked --all-extras python -m unittest discover -s tests -v -b
      - name: Build wheel and source archive
        run: uv build --no-sources
      - name: Check built base package and CLI entry points
        run: |
          uv venv /tmp/iristool-wheel
          uv pip install --python /tmp/iristool-wheel/bin/python dist/*.whl
          /tmp/iristool-wheel/bin/python -c 'from iristool import IRIStool; assert callable(IRIStool.export_table)'
          /tmp/iristool-wheel/bin/iristool-kaggle --help
          /tmp/iristool-wheel/bin/iristool-hf --help
          /tmp/iristool-wheel/bin/iristool-export --help
          /tmp/iristool-wheel/bin/iristool-mcp --help
      - name: Check built MCP package and stdio transport
        run: |
          for wheel in dist/*.whl; do
            uv pip install --python /tmp/iristool-wheel/bin/python "${wheel}[mcp,excel]"
          done
          /tmp/iristool-wheel/bin/python -m unittest discover -s tests -p test_mcp.py -v -b
          /tmp/iristool-wheel/bin/python -m unittest discover -s tests -p test_transfer.py -v -b
          /tmp/iristool-wheel/bin/python -m unittest discover -s tests -p test_query_export.py -v -b
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/iristool
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
